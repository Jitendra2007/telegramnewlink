name: CODEX Auto-Harvest & Shortlink Resolver

on:
  schedule:
    # Run every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual 1-click execution from GitHub Actions Web UI

permissions:
  contents: write

concurrency:
  group: telegram-harvest-resolver
  cancel-in-progress: true

jobs:
  harvest-and-resolve:
    name: 5-Cycle Safe Harvester & Audit Engine (7GB RAM Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Install Playwright Chromium with System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: 🚀 Run 5-Cycle Multi-Pass Harvester & Audit Engine
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_STRING_SESSION_SUB: ${{ secrets.TELEGRAM_STRING_SESSION_SUB }}
        run: |
          python github_action_harvest_resolve.py

      - name: 💾 Commit and Push Audit Reports & SQL to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud_reverified_audit.json cloud_reverified_audit.sql cloud_verification_discrepancy_report.md stubborn_failed_links_for_review.json stubborn_failed_links_for_review.md skipped_channels_no_shortlinks.json master_resolved_cache.json || true
          if git diff --staged --quiet; then
            echo "✨ No new audit results or changes to commit."
          else
            git commit -m "chore(audit): update 5-cycle verification, stubborn failed links & SQL [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git fetch origin main
            git merge -X ours origin/main -m "Merge remote main into audit updates" || true
            git push origin main || git push --force-with-lease origin main || true
            echo "✅ Successfully pushed audit reports, stubborn links list & verified SQL to GitHub!"
          fi
